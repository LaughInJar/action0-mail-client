[package]
name = "action0"
version = "0.1.0"
description = "action0 mail client"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "action0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
# The same reqwest and rustls (with ring) as the updater, so there's one TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "form", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
url = "2"
percent-encoding = "2"
thiserror = "2"
# IMAP and SMTP accounts: IMAP (SMTP is our own small client), TLS with
# our own certificate checks, certificates' details, finding settings
# (autoconfig XML), reading mail.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
roxmltree = "0.21"
mail-parser = "1.0"
futures = { version = "0.3", default-features = false, features = ["std"] }

# Desktop only: one instance, mailto: links, dialogs and files,
# notifications, the tray, autostart, updates, window state, the OS keychain.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-window-state = "2.5"
keyring = "4"
# The system's certificate checks for mail servers, and MX lookups (the
# system's DNS settings, which Android doesn't let us read).
rustls-platform-verifier = "0.7"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# Spell checking in the web view: WebKitGTK's context (the same crate as
# wry's), and the app's defaults on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

# Android: the app's Kotlin side (sign-in, files, notifications, background
# checks), JNI for the background check, and Mozilla's root certificates.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-action0 = { path = "plugins/action0" }
jni = "0.21"
webpki-roots = "1"

[dev-dependencies]
wiremock = "0.6"
rcgen = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
