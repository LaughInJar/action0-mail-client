name: Release

# Pushing a tag like v0.2.0 builds the desktop app for Linux, Windows and
# macOS into a draft GitHub Release, with the signed `latest.json` the app's
# updater reads once the release is published. First it checks that the tag
# matches the versions (package.json, Cargo.toml, Cargo.lock), that the
# commit is on main, and everything CI checks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The tag matches every version, and the commit is on main.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Tag matches package.json, Cargo.toml and Cargo.lock
        run: node scripts/check-release.ts "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Release from main."
            exit 1
          }

  # Everything CI checks, before any installer is built.
  checks:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: [verify, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on older systems too.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates (`npx tauri signer generate`; the public key is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: OAuth clients built into the app (otherwise entered in the app).
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: action0 ${{ github.ref_name }}
          releaseBody: Download the installer for your system below. Installed apps update themselves.
          releaseDraft: true
          prerelease: false
          # Signed update files (local builds skip them: they need the key).
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
