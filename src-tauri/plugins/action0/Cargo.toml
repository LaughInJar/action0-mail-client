[package]
name = "tauri-plugin-action0"
version = "0.1.0"
description = "action0's Android side: sign-in, the vault key, files, notifications, background checks."
edition = "2024"
rust-version = "1.90"
publish = false
links = "tauri-plugin-action0"

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
